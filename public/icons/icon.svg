
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Inner subtle border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="white" stroke-opacity="0.15" stroke-width="4" />

  <!-- MAI Stylized Network / People / Connectivity Node Group -->
  <g filter="url(#shadow)" transform="translate(40, 40)">
    <!-- Central Node (System Core) -->
    <circle cx="216" cy="216" r="64" fill="white" />
    <circle cx="216" cy="216" r="40" fill="#2563eb" />
    
    <!-- Left Top Node (Organization) -->
    <line x1="216" y1="216" x2="100" y2="110" stroke="white" stroke-width="18" stroke-linecap="round" stroke-opacity="0.8" />
    <circle cx="100" cy="110" r="44" fill="url(#accentGradient)" />
    <circle cx="100" cy="110" r="24" fill="white" />

    <!-- Right Top Node (Position) -->
    <line x1="216" y1="216" x2="332" y2="110" stroke="white" stroke-width="18" stroke-linecap="round" stroke-opacity="0.8" />
    <circle cx="332" cy="110" r="44" fill="url(#accentGradient)" />
    <circle cx="332" cy="110" r="24" fill="white" />

    <!-- Bottom Node (Employee) -->
    <line x1="216" y1="216" x2="216" y2="336" stroke="white" stroke-width="18" stroke-linecap="round" stroke-opacity="0.8" />
    <circle cx="216" cy="336" r="50" fill="white" />
    
    <!-- User/Person glyph inside bottom node -->
    <circle cx="216" cy="324" r="14" fill="#2563eb" />
    <path d="M194 354 C194 340, 238 340, 238 354 Z" fill="#2563eb" />
  </g>

  <!-- Text Badge at bottom center -->
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">MAI HRIS</text>
</svg>
